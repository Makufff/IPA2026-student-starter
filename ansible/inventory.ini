[routers]
target

[routers:vars]
ansible_host="{{ router }}"
ansible_connection=ansible.netcommon.network_cli
ansible_network_os=cisco.ios.ios
ansible_user="{{ lookup('ansible.builtin.env', 'ROUTER_USER') }}"
ansible_password="{{ lookup('ansible.builtin.env', 'ROUTER_PASS') }}"
ansible_host_key_checking=False
ansible_command_timeout=10
