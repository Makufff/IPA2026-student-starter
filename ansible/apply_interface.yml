---
- name: Apply IPA2026 interface desired state
  hosts: routers
  gather_facts: false

  tasks:
    - name: Configure complete interface state
      cisco.ios.ios_config:
        parents:
          - "interface {{ interface_name }}"
        lines:
          - "description {{ description }}"
          - "ip address {{ ipv4_address }} {{ netmask }}"
          - "{{ 'shutdown' if shutdown | bool else 'no shutdown' }}"
        defaults: true
